<!DOCTYPE html>
<html>
<head>
    <title>PDF RAG</title>
</head>
<body>

    <h1>PDF RAG System</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="pdf" accept=".pdf">

        <button type="submit">Upload PDF</button>
    </form>

    {% if extracted_text %}
        <h2>Extracted Text:</h2>
        <pre>{{ extracted_text }}</pre>
    {% endif %}

</body>
</html>
